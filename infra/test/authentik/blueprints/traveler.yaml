# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# The two Traveler applications in authentik 2026.8.5. The worker applies this
# file on its own (it is mounted under /blueprints/custom), and again whenever
# the file changes. See ../../DEPLOY.md, "Sign-in applications".
#
# Each application has its own OAuth2/OpenID provider, so its tokens carry its
# own audience (the client ID) and are meant for its own backend only. Both are
# public clients (no secret) limited to the authorization code flow. The clients
# send PKCE and authentik checks it; this release has no switch to require it.
# authentik only authenticates: roles live in the admin database.
version: 1
metadata:
  name: Traveler - Applications
entries:
  # authentik applies blueprints in no fixed order. These make sure the default
  # flows and the scope mappings below exist before they are looked up.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: false

  # Staff accounts, used by the admin web app (admin-web/).
  - model: authentik_providers_oauth2.oauth2provider
    id: traveler-admin-provider
    identifiers:
      name: Traveler admin
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: traveler-admin
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:5173/auth/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Env [ADMIN_WEB_URL, "https://admin-web.example.invalid"]]
          redirect_uri_type: authorization
        # Where the app may send the browser after sign-out.
        - matching_mode: strict
          url: http://localhost:5173/login
          redirect_uri_type: logout
        - matching_mode: strict
          url: !Format ["%s/login", !Env [ADMIN_WEB_URL, "https://admin-web.example.invalid"]]
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        # Needed for a refresh token: authentik issues one only for this scope.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      issuer_mode: per_provider
      # sub is the authentik user's UUID, which the admin backend maps to staff_users.
      sub_mode: user_uuid
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    identifiers:
      slug: traveler-admin
    attrs:
      name: Traveler admin
      provider: !KeyOf traveler-admin-provider

  # Tourists, used by the mobile app. The mobile app work (EN-05) sets the real
  # redirect URI through TRAVELER_APP_REDIRECT_URI.
  - model: authentik_providers_oauth2.oauth2provider
    id: traveler-app-provider
    identifiers:
      name: Traveler app
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: traveler-app
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: !Env [TRAVELER_APP_REDIRECT_URI, "https://placeholder.example.invalid/set-by-en-05"]
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      issuer_mode: per_provider
      sub_mode: user_uuid
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    identifiers:
      slug: traveler-app
    attrs:
      name: Traveler app
      provider: !KeyOf traveler-app-provider
