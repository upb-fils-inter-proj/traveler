version: 2

updates:
  - package-ecosystem: maven
    directory: /tourist-backend
    schedule:
      interval: weekly
    # The backends stay on Spring Boot 3 (and the springdoc line that matches it).
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /admin-backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /tourist-backend
    schedule:
      interval: weekly
    # The Java version is chosen by hand (21, the LTS the project runs on). Both tags
    # float across the patch releases of their line, so the only update Dependabot
    # can propose is a jump to another Java version.
    ignore:
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"

  - package-ecosystem: docker
    directory: /admin-backend
    schedule:
      interval: weekly
    # The Java version is chosen by hand (21, the LTS the project runs on). Both tags
    # float across the patch releases of their line, so the only update Dependabot
    # can propose is a jump to another Java version.
    ignore:
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra/test
    schedule:
      interval: weekly
    # A new major version of PostgreSQL or Redis needs a migration plan, and Nginx
    # stays on its stable line (1.28). Those moves are made by hand.
    ignore:
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
