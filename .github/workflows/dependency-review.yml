name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fails the pull request when it adds or updates a dependency with a known
      # vulnerability of high or critical severity.
      - uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
