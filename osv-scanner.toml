# Vulnerabilities that the dependency scan (.github/workflows/dependency-scan.yml)
# is told to skip. Every entry needs a reason and an end date, so that it comes
# back and is looked at again. Remove an entry as soon as a fix can be applied.

# Spring Framework 6.2 is the line that Spring Boot 3.5 manages. The advisories
# below list no fix for it: the first fixed version is 7.0.9, which belongs to
# Spring Boot 4. The backends are JSON APIs without views, so neither feature is
# used. Moving to Spring Boot 4 is a decision for the team.

[[IgnoredVulns]]
id = "GHSA-j9f9-w8pj-32f8"
effectiveUntil = 2026-12-31
reason = "CVE-2026-47890: Server-Sent Events with view fragments in Spring MVC. The backends use no SSE and no views. No fix for Spring Framework 6.2."

[[IgnoredVulns]]
id = "GHSA-pc63-qcmh-9cmg"
effectiveUntil = 2026-12-31
reason = "CVE-2026-47884: XsltView with a catch-all mapping. The backends use no view technology. No fix for Spring Framework 6.2."

# picomatch is a development dependency of the admin web app: only vite and vitest
# (through fdir and tinyglobby) use it, and none of it is shipped. The advisory is a
# regular expression denial of service through crafted glob patterns, and 4.0.7 is
# the newest release, so there is no fix yet.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
effectiveUntil = 2026-12-31
reason = "CVE-2026-112366: ReDoS in picomatch through crafted glob patterns. Used only by vite and vitest in admin-web, not shipped. 4.0.7 is the newest release and has no fix."
